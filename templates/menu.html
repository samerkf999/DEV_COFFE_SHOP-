<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نشمي كافيه — المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:#8a6b28;--dark:#0d0a07;--dark2:#1a1410;--dark3:#241e16;--wood:#2d2118;--white:#fff8ed;--text-sub:#b89a6a}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--white);font-family:'Tajawal',sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(201,168,76,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(201,168,76,.05) 0%,transparent 50%)}
.header{position:sticky;top:0;z-index:100;background:rgba(13,10,7,.97);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,.2);padding:14px 20px}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:800px;margin:0 auto}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:45px;height:45px;border-radius:50%;object-fit:cover;box-shadow:0 0 15px rgba(201,168,76,.3);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-text{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold)}
.logo-sub{font-size:11px;color:var(--text-sub);margin-top:1px}
.header-phone{font-size:13px;color:var(--text-sub)}.header-phone span{color:var(--gold);font-weight:600}
.cats-nav{position:sticky;top:71px;z-index:99;background:var(--dark2);border-bottom:1px solid rgba(201,168,76,.1);overflow-x:auto;scrollbar-width:none}
.cats-nav::-webkit-scrollbar{display:none}
.cats-inner{display:flex;padding:0 12px;min-width:max-content;max-width:800px;margin:0 auto}
.cat-btn{padding:12px 18px;border:none;background:transparent;color:var(--text-sub);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .25s;display:flex;align-items:center;gap:6px}
.cat-btn:hover{color:var(--gold-light)}.cat-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.content{max-width:800px;margin:0 auto;padding:0 16px 80px}
.section{padding-top:28px;animation:fadeUp .4s ease both}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(201,168,76,.15)}
.section-icon{width:40px;height:40px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.section-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold)}
.section-count{font-size:11px;color:var(--text-sub);margin-top:2px}
.items-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.items-grid{grid-template-columns:repeat(3,1fr)}}
.item-card{background:var(--dark3);border:1px solid rgba(201,168,76,.1);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.item-card:hover{transform:translateY(-3px);border-color:rgba(201,168,76,.35);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.item-card.unavailable{opacity:.45;filter:grayscale(.5)}
.item-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.item-placeholder{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,var(--wood),#1a1209);display:flex;align-items:center;justify-content:center;font-size:38px}
.item-body{padding:12px}
.item-name{font-size:14px;font-weight:700;color:var(--white);margin-bottom:4px;line-height:1.3}
.item-desc{font-size:11px;color:var(--text-sub);line-height:1.5;margin-bottom:8px;min-height:16px}
.item-footer{display:flex;align-items:center;justify-content:space-between}
.item-price{font-size:16px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.item-cur{font-size:10px;color:var(--gold-dim);margin-left:2px}
.item-badge{font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.25)}
.item-badge.unavail{background:rgba(180,50,50,.15);color:#e07070;border-color:rgba(180,50,50,.3)}
.footer{text-align:center;padding:28px 20px;border-top:1px solid rgba(201,168,76,.1);margin-top:20px}
.footer-text{font-size:13px;color:var(--text-sub)}
.footer-brand{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold);margin-top:6px}
.wifi-box{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 16px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:20px;font-size:12px}
.wifi-label{color:var(--text-sub)}.wifi-val{color:var(--gold);font-weight:600}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo-wrap">
      <img id="logoImg" src="/static/logo.jpg" alt="نشمي" style="height:45px;width:45px;border-radius:50%;object-fit:cover;box-shadow:0 0 15px rgba(201,168,76,.3)" onerror="this.style.display='none'">
      <div class="logo-icon" id="logoFallback" style="display:none">&#9749;</div>
      <div><div class="logo-text" id="cafeName">نشمي كافيه</div><div class="logo-sub">قائمة الأسعار</div></div>
    </div>
    <div class="header-phone">&#128222; <span id="cafePhone"></span></div>
  </div>
</header>
<nav class="cats-nav"><div class="cats-inner" id="catsInner"></div></nav>
<main class="content" id="mainContent">
  <div class="loading"><div class="spinner"></div><span style="color:var(--text-sub);font-size:14px">جارٍ تحميل المنيو...</span></div>
</main>
<footer class="footer" id="pageFooter" style="display:none">
  <div class="footer-text" id="footerText">شكراً لزيارتكم</div>
  <div class="footer-brand">نشمي كافيه &#10022;</div>
  <div class="wifi-box" id="wifiBox" style="display:none">
    <span>&#128246;</span>
    <span class="wifi-label">Wi-Fi:</span><span class="wifi-val" id="wifiName"></span>
    <span style="color:rgba(201,168,76,.3)">|</span>
    <span class="wifi-label">كلمة السر:</span><span class="wifi-val" id="wifiPass"></span>
  </div>
</footer>
<script>
var S={},CATS=[],ITEMS={};
function start(){
  Promise.all([fetch('/api/settings').then(function(r){return r.json();}),fetch('/api/categories').then(function(r){return r.json();}),fetch('/api/items').then(function(r){return r.json();})])
  .then(function(d){
    S=d[0];CATS=d[1];
    d[2].forEach(function(it){if(!ITEMS[it.category_id])ITEMS[it.category_id]=[];ITEMS[it.category_id].push(it);});
    applyS();buildNav();buildContent();spy();
  }).catch(function(){
    document.getElementById('mainContent').innerHTML='<div class="loading"><p style="color:#e07070">&#9888; تعذّر تحميل المنيو. تأكد من تشغيل الخادم.</p></div>';
  });
}
function applyS(){
  document.getElementById('cafeName').textContent=S.cafe_name||'نشمي كافيه';
  document.getElementById('cafePhone').textContent=S.phone||'';
  document.getElementById('footerText').textContent=S.footer_text||'شكراً لزيارتكم';
  document.title=(S.cafe_name||'نشمي كافيه')+' — المنيو';
  if(S.wifi_name){document.getElementById('wifiName').textContent=S.wifi_name;document.getElementById('wifiPass').textContent=S.wifi_password||'—';document.getElementById('wifiBox').style.display='inline-flex';}
  document.getElementById('pageFooter').style.display='block';
}
function buildNav(){
  document.getElementById('catsInner').innerHTML=CATS.map(function(c,i){
    return '<button class="cat-btn'+(i===0?' active':'')+'" onclick="goTo(\'sec-'+c.id+'\')" data-cat="'+c.id+'">'+c.icon+' '+c.name_ar+'</button>';
  }).join('');
}
function buildContent(){
  var cur=S.currency||'د.أ';
  document.getElementById('mainContent').innerHTML=CATS.map(function(c,idx){
    var its=ITEMS[c.id]||[];if(!its.length)return '';
    var av=its.filter(function(i){return i.is_available;}).length;
    var cards=its.map(function(it){
      var u=!it.is_available;
      var thumb=it.image_path?'<img class="item-thumb" src="'+it.image_path+'" alt="'+it.name_ar+'" loading="lazy">':'<div class="item-placeholder">'+getCIcon(it.category_id)+'</div>';
      return '<div class="item-card'+(u?' unavailable':'')+'">'+thumb+'<div class="item-body"><div class="item-name">'+it.name_ar+'</div><div class="item-desc">'+(it.description||'')+'</div><div class="item-footer"><div class="item-price">'+it.price.toFixed(3)+'<span class="item-cur"> '+cur+'</span></div><div class="item-badge'+(u?' unavail':'')+'">'+( u?'غير متاح':'متاح')+'</div></div></div></div>';
    }).join('');
    return '<section class="section" id="sec-'+c.id+'" style="animation-delay:'+(idx*.1)+'s"><div class="section-header"><div class="section-icon">'+c.icon+'</div><div><div class="section-title">'+c.name_ar+'</div><div class="section-count">'+av+' صنف متاح</div></div></div><div class="items-grid">'+cards+'</div></section>';
  }).join('');
}
function getCIcon(id){var c=CATS.find(function(x){return x.id===id;});return c?c.icon:'&#9749;';}
function goTo(id){var el=document.getElementById(id);if(el){var top=el.getBoundingClientRect().top+window.scrollY-125;window.scrollTo({top:top,behavior:'smooth'});}}
function spy(){
  var secs=CATS.map(function(c){return document.getElementById('sec-'+c.id);}).filter(Boolean);
  var btns=document.querySelectorAll('.cat-btn');
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var id=parseInt(e.target.id.replace('sec-',''));
        btns.forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.cat)===id);});
        var ab=document.querySelector('.cat-btn.active');
        if(ab)ab.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
      }
    });
  },{threshold:0.2,rootMargin:'-120px 0px -60% 0px'});
  secs.forEach(function(s){obs.observe(s);});
}
start();
</script>
</body>
</html>
