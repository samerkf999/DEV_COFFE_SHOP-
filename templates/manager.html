<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نشمي — لوحة المدير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-dim:#8a6b28;--dark:#0d0a07;--dark2:#141008;--dark3:#1c1510;--dark4:#241a10;--border:rgba(201,168,76,.18);--white:#fff8ed;--sub:#a08060;--green:#4caf7d;--red:#e05555;--blue:#5599cc}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:var(--dark);color:var(--white);font-family:'Tajawal',sans-serif;display:flex;flex-direction:column}
.topbar{height:52px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.topbar img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.topbar-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold)}
.topbar-right{margin-right:auto;display:flex;align-items:center;gap:10px}
.role-chip{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:rgba(85,153,204,.15);color:var(--blue);border:1px solid rgba(85,153,204,.3)}
.day-status{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.day-status.open{background:rgba(76,175,125,.15);color:var(--green)}
.day-status.closed{background:rgba(224,85,85,.15);color:var(--red)}
.btn-logout{background:transparent;border:1px solid rgba(224,85,85,.3);color:var(--red);padding:4px 10px;border-radius:7px;font-size:11px;font-family:'Tajawal',sans-serif;cursor:pointer}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:var(--dark2);border-right:1px solid var(--border);padding:10px 0;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;color:var(--sub);font-size:13px;font-weight:500;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(201,168,76,.06);color:var(--gold)}
.nav-item.active{background:rgba(201,168,76,.1);color:var(--gold);border-left-color:var(--gold)}
.main{flex:1;overflow-y:auto;padding:18px}
.page{display:none}.page.active{display:block}
.page-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--dark3);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:12px 12px 0 0}
.stat-label{font-size:11px;color:var(--sub);margin-bottom:6px}
.stat-val{font-size:20px;font-weight:700;color:var(--white);font-family:'Playfair Display',serif}
.stat-val small{font-size:11px;font-family:'Tajawal',sans-serif;color:var(--sub)}
.btn{padding:7px 14px;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#1a1000}
.btn-red{background:rgba(224,85,85,.15);border:1px solid rgba(224,85,85,.3);color:var(--red)}
.btn-green{background:rgba(76,175,125,.15);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--gold)}
.tbl-wrap{background:var(--dark3);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--dark4);color:var(--gold);font-weight:700;padding:9px 12px;text-align:right;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid rgba(201,168,76,.05);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,168,76,.04)}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.bg{background:rgba(76,175,125,.15);color:var(--green)}.br{background:rgba(224,85,85,.15);color:var(--red)}
.bb{background:rgba(85,153,204,.15);color:var(--blue)}.bo{background:rgba(201,168,76,.15);color:var(--gold)}
.form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:var(--sub)}
input,select,textarea{background:var(--dark4);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--white);font-family:'Tajawal',sans-serif;font-size:12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--gold)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.h{display:none}
.modal{background:var(--dark3);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.mc{cursor:pointer;color:var(--sub);font-size:18px}.mc:hover{color:var(--red)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#toast{position:fixed;bottom:14px;left:14px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast{padding:9px 14px;border-radius:8px;font-size:12px;font-weight:700;animation:sIn .3s ease}
.tok{background:rgba(76,175,125,.2);border:1px solid rgba(76,175,125,.4);color:#7de0aa}
.terr{background:rgba(224,85,85,.2);border:1px solid rgba(224,85,85,.4);color:#f09090}
@keyframes sIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.pos-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border-radius:8px;background:rgba(201,168,76,.1);border:1px solid var(--border);color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="topbar">
  <img src="/static/logo.jpg" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">نشمي كافيه — المدير</div>
  <div class="topbar-right">
    <span id="userName" style="font-size:12px;color:var(--sub)"></span>
    <span class="role-chip">Manager</span>
    <span class="day-status closed" id="dayStatus">مغلق</span>
    <a href="/pos" class="pos-link">&#128179; POS</a>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </div>
</div>
<div class="layout">
  <nav class="sidebar">
    <div class="nav-item active" onclick="go('dashboard')" id="nav-dashboard">&#128202; الرئيسية</div>
    <div class="nav-item" onclick="go('daily')" id="nav-daily">&#128197; اليوم</div>
    <div class="nav-item" onclick="go('orders')" id="nav-orders">&#128203; الطلبات</div>
    <div class="nav-item" onclick="go('accounts')" id="nav-accounts">&#128196; الذمم</div>
    <div class="nav-item" onclick="go('inventory')" id="nav-inventory">&#128230; المخزون</div>
    <div class="nav-item" onclick="go('menu-mgr')" id="nav-menu-mgr">&#9998; المنيو</div>
    <div class="nav-item" onclick="go('reports')" id="nav-reports">&#128200; التقارير</div>
  </nav>
  <main class="main">

    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="page-title">&#128202; الرئيسية</div>
      <div class="stats" id="dashStats"></div>
      <div id="dashActions"></div>
    </div>

    <!-- DAILY -->
    <div class="page" id="page-daily">
      <div class="page-title">&#128197; إدارة اليوم</div>
      <div id="dailyContent"></div>
    </div>

    <!-- ORDERS -->
    <div class="page" id="page-orders">
      <div class="page-title">&#128203; الطلبات</div>
      <div class="toolbar">
        <label style="font-size:11px;color:var(--sub)">التاريخ:</label>
        <input type="date" id="orderDate" style="width:auto" onchange="loadOrders()">
      </div>
      <div id="ordersContent"></div>
    </div>

    <!-- ACCOUNTS -->
    <div class="page" id="page-accounts">
      <div class="page-title">&#128196; الذمم</div>
      <div class="toolbar"><button class="btn btn-gold" onclick="openM('addAccModal')">+ إضافة حساب</button></div>
      <div id="accContent"></div>
    </div>

    <!-- INVENTORY -->
    <div class="page" id="page-inventory">
      <div class="page-title">&#128230; المخزون</div>
      <div class="toolbar"><button class="btn btn-gold" onclick="openM('addInvModal')">+ مادة جديدة</button></div>
      <div id="invContent"></div>
    </div>

    <!-- MENU -->
    <div class="page" id="page-menu-mgr">
      <div class="page-title">&#9998; إدارة المنيو</div>
      <div class="toolbar">
        <select id="filterCat" style="width:auto" onchange="loadMenuMgr()"><option value="">الكل</option></select>
        <button class="btn btn-gold" onclick="openM('addItemModal')">+ صنف جديد</button>
      </div>
      <div id="menuMgrContent"></div>
    </div>

    <!-- REPORTS -->
    <div class="page" id="page-reports">
      <div class="page-title">&#128200; التقارير</div>
      <div class="toolbar">
        <input type="month" id="reportMonth" style="width:auto" onchange="loadMonthly()">
      </div>
      <div id="reportsContent"></div>
    </div>

  </main>
</div>

<!-- Modals -->
<div class="overlay h" id="addAccModal"><div class="modal">
  <div class="modal-title">إضافة حساب <span class="mc" onclick="closeM('addAccModal')">&#10005;</span></div>
  <div class="fg" style="margin-bottom:10px"><label>الاسم *</label><input id="accName"></div>
  <div class="fg" style="margin-bottom:14px"><label>الهاتف</label><input id="accPhone" type="tel"></div>
  <button class="btn btn-gold" style="width:100%" onclick="addAccount()">إضافة</button>
</div></div>

<div class="overlay h" id="payAccModal"><div class="modal">
  <div class="modal-title">تسجيل دفعة <span class="mc" onclick="closeM('payAccModal')">&#10005;</span></div>
  <p id="payInfo" style="font-size:12px;color:var(--sub);margin-bottom:12px"></p>
  <div class="fg" style="margin-bottom:10px"><label>المبلغ *</label><input id="payAmt" type="number" step="0.001" min="0"></div>
  <div class="fg" style="margin-bottom:14px"><label>بيان</label><input id="payDesc" placeholder="دفعة نقدية"></div>
  <button class="btn btn-green" style="width:100%" onclick="submitPay()">&#10003; تسجيل</button>
</div></div>

<div class="overlay h" id="addInvModal"><div class="modal">
  <div class="modal-title">إضافة مادة <span class="mc" onclick="closeM('addInvModal')">&#10005;</span></div>
  <div class="form-row">
    <div class="fg"><label>الاسم *</label><input id="invName"></div>
    <div class="fg"><label>الوحدة *</label><input id="invUnit" placeholder="كيلو / لتر"></div>
    <div class="fg"><label>الكمية الحالية</label><input id="invStock" type="number" step="0.01" value="0"></div>
    <div class="fg"><label>حد التنبيه</label><input id="invMin" type="number" step="0.01" value="0"></div>
  </div>
  <button class="btn btn-gold" style="width:100%;margin-top:6px" onclick="addInv()">إضافة</button>
</div></div>

<div class="overlay h" id="invActionModal"><div class="modal">
  <div class="modal-title" id="invActionTitle">تحديث المخزون <span class="mc" onclick="closeM('invActionModal')">&#10005;</span></div>
  <input type="hidden" id="invActionId"><input type="hidden" id="invActionType">
  <p id="invActionDesc" style="font-size:12px;color:var(--sub);margin-bottom:12px"></p>
  <div class="fg" style="margin-bottom:10px"><label>الكمية *</label><input id="invQty" type="number" step="0.01" min="0"></div>
  <div class="fg" style="margin-bottom:14px"><label>ملاحظات</label><input id="invNote"></div>
  <button class="btn btn-gold" style="width:100%" onclick="submitInvAction()">&#10003; تأكيد</button>
</div></div>

<div class="overlay h" id="addItemModal"><div class="modal">
  <div class="modal-title" id="itemModalTitle">إضافة صنف <span class="mc" onclick="closeM('addItemModal')">&#10005;</span></div>
  <input type="hidden" id="itemId">
  <div class="form-row">
    <div class="fg"><label>اسم عربي *</label><input id="itemNameAr"></div>
    <div class="fg"><label>اسم إنجليزي</label><input id="itemName"></div>
    <div class="fg"><label>القسم *</label><select id="itemCat"></select></div>
    <div class="fg"><label>السعر *</label><input id="itemPrice" type="number" step="0.001" min="0"></div>
  </div>
  <div class="fg" style="margin-bottom:12px"><label>وصف</label><textarea id="itemDesc" style="min-height:55px"></textarea></div>
  <div class="fg" style="margin-bottom:14px"><label>صورة</label><input type="file" id="itemImg" accept="image/*" style="background:transparent;border:none;padding:0;color:var(--sub)"></div>
  <label style="display:flex;align-items:center;gap:6px;margin-bottom:14px;cursor:pointer"><input type="checkbox" id="itemAvail" checked style="width:auto;accent-color:var(--gold)"> <span style="font-size:12px">متاح للبيع</span></label>
  <button class="btn btn-gold" style="width:100%" onclick="saveItem()">&#10003; حفظ</button>
</div></div>

<div class="overlay h" id="openDayModal"><div class="modal">
  <div class="modal-title">&#128197; فتح اليوم <span class="mc" onclick="closeM('openDayModal')">&#10005;</span></div>
  <div class="fg" style="margin-bottom:14px"><label>رصيد الصندوق الافتتاحي (د.أ)</label><input id="openCash" type="number" step="0.001" value="0" min="0"></div>
  <button class="btn btn-gold" style="width:100%" onclick="openDay()">&#10003; فتح اليوم</button>
</div></div>

<div class="overlay h" id="closeDayModal"><div class="modal">
  <div class="modal-title">&#128197; إغلاق اليوم <span class="mc" onclick="closeM('closeDayModal')">&#10005;</span></div>
  <div class="fg" style="margin-bottom:10px"><label>رصيد الصندوق الختامي (د.أ)</label><input id="closeCash" type="number" step="0.001" value="0" min="0"></div>
  <div class="fg" style="margin-bottom:14px"><label>ملاحظات</label><textarea id="closeNotes" style="min-height:55px"></textarea></div>
  <button class="btn btn-red" style="width:100%" onclick="closeDay()">&#128197; إغلاق اليوم</button>
</div></div>

<div id="toast"></div>
<script>
var G_cats=[],G_items=[],G_accounts=[],payAccId=null,editItemId=null;
var fmt=n=>parseFloat(n||0).toFixed(3);

function init(){
  fetch('/api/auth/me').then(r=>r.json()).then(d=>{
    if(!d.loggedIn){location.href='/login';return;}
    document.getElementById('userName').textContent=d.user.name;
  });
  Promise.all([fetch('/api/categories').then(r=>r.json()),fetch('/api/items').then(r=>r.json()),fetch('/api/daily/today').then(r=>r.json())])
  .then(([c,it,day])=>{G_cats=c;G_items=it;updateDay(day);loadDash(day);buildCatOpts();});
  document.getElementById('orderDate').value=today();
  document.getElementById('reportMonth').value=today().substring(0,7);
}
function today(){return new Date().toISOString().split('T')[0];}
function updateDay(rec){
  var el=document.getElementById('dayStatus');
  if(rec&&rec.status==='open'){el.textContent='مفتوح';el.className='day-status open';}
  else{el.textContent='مغلق';el.className='day-status closed';}
}
function go(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+pg).classList.add('active');
  document.getElementById('nav-'+pg).classList.add('active');
  if(pg==='daily')loadDaily();
  if(pg==='orders')loadOrders();
  if(pg==='accounts')loadAccounts();
  if(pg==='inventory')loadInventory();
  if(pg==='menu-mgr')loadMenuMgr();
  if(pg==='reports')loadMonthly();
}
function openM(id){document.getElementById(id).classList.remove('h');}
function closeM(id){document.getElementById(id).classList.add('h');}
function toast(msg,t='ok'){
  var el=document.createElement('div');el.className='toast '+(t==='err'?'terr':'tok');el.textContent=msg;
  document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),3200);
}
function api(url,opts){return fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opts||{})).then(r=>r.json());}

// Dashboard
function loadDash(rec){
  fetch('/api/reports/dashboard').then(r=>r.json()).then(d=>{
    document.getElementById('dashStats').innerHTML=`
      <div class="stat"><div class="stat-label">مبيعات اليوم</div><div class="stat-val">${fmt(d.today_sales)} <small>د.أ</small></div></div>
      <div class="stat"><div class="stat-label">كاش</div><div class="stat-val">${fmt(d.today_cash)} <small>د.أ</small></div></div>
      <div class="stat"><div class="stat-label">كليك</div><div class="stat-val">${fmt(d.today_cliq)} <small>د.أ</small></div></div>
      <div class="stat"><div class="stat-label">الطلبات</div><div class="stat-val">${d.today_orders}</div></div>
      <div class="stat"><div class="stat-label">إجمالي الذمم</div><div class="stat-val">${fmt(d.total_debt)} <small>د.أ</small></div></div>
      <div class="stat"><div class="stat-label">تنبيهات مخزون</div><div class="stat-val" style="color:${d.low_stock>0?'var(--red)':'var(--green)'}">${d.low_stock}</div></div>`;
    var status=d.today_status;
    document.getElementById('dashActions').innerHTML=status==='open'
      ?`<button class="btn btn-red" onclick="openM('closeDayModal')">&#128197; إغلاق اليوم</button>`
      :`<button class="btn btn-gold" onclick="openM('openDayModal')">&#128197; فتح اليوم</button>`;
  });
}

// Daily
function loadDaily(){
  fetch('/api/daily/today').then(r=>r.json()).then(rec=>{
    updateDay(rec);
    var html='';
    if(!rec||rec.status!=='open'){html='<button class="btn btn-gold" onclick="openM(\'openDayModal\')">&#128197; فتح اليوم</button>';}
    else{html=`<div class="stats"><div class="stat"><div class="stat-label">المبيعات</div><div class="stat-val">${fmt(rec.total_sales)} <small>د.أ</small></div></div><div class="stat"><div class="stat-label">كاش</div><div class="stat-val">${fmt(rec.total_sales_cash)}</div></div><div class="stat"><div class="stat-label">كليك</div><div class="stat-val">${fmt(rec.total_sales_cliq)}</div></div><div class="stat"><div class="stat-label">وقت الفتح</div><div class="stat-val" style="font-size:16px">${rec.opening_time||'—'}</div></div></div><button class="btn btn-red" onclick="openM('closeDayModal')" style="margin-bottom:14px">&#128197; إغلاق اليوم</button>`;}
    html+='<hr class="divider"><div style="font-weight:700;color:var(--gold);font-size:14px;margin-bottom:8px">سجلات الأيام</div><div id="dailyRecs"></div>';
    document.getElementById('dailyContent').innerHTML=html;
    fetch('/api/daily/records?limit=20').then(r=>r.json()).then(rows=>{
      document.getElementById('dailyRecs').innerHTML='<div class="tbl-wrap"><table><tr><th>التاريخ</th><th>الحالة</th><th>كاش</th><th>كليك</th><th>الإجمالي</th></tr>'
        +rows.map(r=>`<tr><td>${r.date}</td><td><span class="badge ${r.status==='open'?'bg':'bo'}">${r.status==='open'?'مفتوح':'مغلق'}</span></td><td>${fmt(r.total_sales_cash)}</td><td>${fmt(r.total_sales_cliq)}</td><td style="font-weight:700;color:var(--gold)">${fmt(r.total_sales)}</td></tr>`).join('')+'</table></div>';
    });
  });
}
function openDay(){
  api('/api/daily/open',{method:'POST',body:JSON.stringify({opening_cash:parseFloat(document.getElementById('openCash').value)||0})})
  .then(d=>{toast(d.message,d.success?'ok':'err');if(d.success){closeM('openDayModal');loadDaily();fetch('/api/daily/today').then(r=>r.json()).then(updateDay);}});
}
function closeDay(){
  api('/api/daily/close',{method:'POST',body:JSON.stringify({closing_cash:parseFloat(document.getElementById('closeCash').value)||0,notes:document.getElementById('closeNotes').value})})
  .then(d=>{if(d.success){toast('تم الإغلاق — إجمالي: '+fmt(d.summary.total_sales)+' د.أ');closeM('closeDayModal');loadDaily();fetch('/api/daily/today').then(r=>r.json()).then(updateDay);}else toast(d.message,'err');});
}

// Orders
function loadOrders(){
  var dt=document.getElementById('orderDate').value||today();
  api('/api/orders?date='+dt).then(orders=>{
    if(!orders.length){document.getElementById('ordersContent').innerHTML='<p style="color:var(--sub);font-size:13px">لا توجد طلبات.</p>';return;}
    var tot=orders.reduce((s,o)=>s+o.total_amount,0);
    var html=`<div class="stats" style="margin-bottom:12px"><div class="stat"><div class="stat-label">عدد الطلبات</div><div class="stat-val">${orders.length}</div></div><div class="stat"><div class="stat-label">الإجمالي</div><div class="stat-val">${fmt(tot)} <small>د.أ</small></div></div></div>`;
    html+='<div class="tbl-wrap"><table><tr><th>#</th><th>الوقت</th><th>طاولة</th><th>الدفع</th><th>الأصناف</th><th>المجموع</th><th>حذف</th></tr>'
      +orders.map(o=>{
        var pm=o.payment_method==='cash'?'كاش':o.payment_method==='cliq'?'كليك':'ذمة';
        var cls=o.payment_method==='cash'?'bg':o.payment_method==='cliq'?'bb':'bo';
        var itms=o.items.map(i=>i.quantity+'×'+i.item_name).join(' | ');
        return`<tr><td>${o.id}</td><td style="font-size:11px">${(o.created_at||'').substring(11,16)}</td><td>${o.table_number||'—'}</td><td><span class="badge ${cls}">${pm}</span></td><td style="font-size:11px;color:var(--sub)">${itms}</td><td style="font-weight:700;color:var(--gold)">${fmt(o.total_amount)}</td><td><button class="btn btn-red" style="padding:3px 8px;font-size:11px" onclick="deleteOrder(${o.id})">&#128465;</button></td></tr>`;
      }).join('')+'</table></div>';
    document.getElementById('ordersContent').innerHTML=html;
  });
}
function deleteOrder(id){
  if(!confirm('حذف الطلب #'+id+'؟'))return;
  api('/api/orders/'+id,{method:'DELETE'}).then(d=>{toast(d.message,d.success?'ok':'err');loadOrders();});
}

// Accounts
function loadAccounts(){
  fetch('/api/accounts').then(r=>r.json()).then(rows=>{
    G_accounts=rows;
    var tot=rows.reduce((s,a)=>s+a.total_debt,0);
    var html=`<div class="stats" style="margin-bottom:12px"><div class="stat"><div class="stat-label">إجمالي الذمم</div><div class="stat-val">${fmt(tot)} <small>د.أ</small></div></div></div>`;
    if(!rows.length)html+='<p style="color:var(--sub);font-size:13px">لا توجد حسابات.</p>';
    else html+='<div class="tbl-wrap"><table><tr><th>الزبون</th><th>الهاتف</th><th>المديونية</th><th>إجراءات</th></tr>'
      +rows.map(a=>`<tr><td style="font-weight:700">${a.customer_name}</td><td style="color:var(--sub)">${a.phone||'—'}</td><td style="font-weight:700;color:${a.total_debt>0?'var(--red)':'var(--green)'}">${fmt(a.total_debt)} د.أ</td><td><div style="display:flex;gap:5px"><button class="btn btn-green" style="padding:3px 8px;font-size:11px" onclick="openPayModal(${a.id},'${a.customer_name}',${a.total_debt})">&#10003; دفعة</button></div></td></tr>`).join('')+'</table></div>';
    document.getElementById('accContent').innerHTML=html;
  });
}
function addAccount(){
  var name=document.getElementById('accName').value.trim();
  if(!name){toast('الاسم مطلوب','err');return;}
  api('/api/accounts',{method:'POST',body:JSON.stringify({customer_name:name,phone:document.getElementById('accPhone').value})})
  .then(d=>{toast(d.message,d.success?'ok':'err');if(d.success){closeM('addAccModal');document.getElementById('accName').value='';document.getElementById('accPhone').value='';loadAccounts();}});
}
function openPayModal(id,name,debt){
  payAccId=id;
  document.getElementById('payInfo').textContent='الزبون: '+name+' — المديونية: '+fmt(debt)+' د.أ';
  document.getElementById('payAmt').value='';document.getElementById('payDesc').value='';
  openM('payAccModal');
}
function submitPay(){
  var amt=parseFloat(document.getElementById('payAmt').value);
  if(!amt||amt<=0){toast('أدخل مبلغاً','err');return;}
  api('/api/accounts/'+payAccId+'/pay',{method:'POST',body:JSON.stringify({amount:amt,description:document.getElementById('payDesc').value||'دفعة'})})
  .then(d=>{toast(d.message,d.success?'ok':'err');if(d.success){closeM('payAccModal');loadAccounts();}});
}

// Inventory
function loadInventory(){
  fetch('/api/inventory').then(r=>r.json()).then(rows=>{
    var low=rows.filter(r=>r.current_stock<=r.min_stock);
    var html=low.length?`<div style="background:rgba(224,144,64,.1);border:1px solid rgba(224,144,64,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#e09040;margin-bottom:10px">&#9888; مواد منخفضة: ${low.map(r=>r.name).join('، ')}</div>`:'';
    html+='<div class="tbl-wrap"><table><tr><th>المادة</th><th>الوحدة</th><th>الكمية</th><th>الحد الأدنى</th><th>الحالة</th><th>إجراءات</th></tr>'
      +rows.map(r=>{var L=r.current_stock<=r.min_stock;return`<tr><td style="font-weight:700">${r.name}</td><td style="color:var(--sub)">${r.unit}</td><td style="${L?'color:var(--red);font-weight:700':''}">${r.current_stock}</td><td style="color:var(--sub)">${r.min_stock}</td><td><span class="badge ${L?'br':'bg'}">${L?'منخفض':'جيد'}</span></td><td><div style="display:flex;gap:5px"><button class="btn btn-green" style="padding:3px 8px;font-size:11px" onclick="invAction(${r.id},'${r.name}','restock')">+ وارد</button><button class="btn btn-outline" style="padding:3px 8px;font-size:11px" onclick="invAction(${r.id},'${r.name}','adjust')">&#128221; جرد</button></div></td></tr>`;}).join('')+'</table></div>';
    document.getElementById('invContent').innerHTML=html;
  });
}
function addInv(){
  var name=document.getElementById('invName').value.trim(),unit=document.getElementById('invUnit').value.trim();
  if(!name||!unit){toast('الاسم والوحدة مطلوبان','err');return;}
  api('/api/inventory',{method:'POST',body:JSON.stringify({name,unit,current_stock:document.getElementById('invStock').value,min_stock:document.getElementById('invMin').value})})
  .then(d=>{toast(d.message,d.success?'ok':'err');if(d.success){closeM('addInvModal');loadInventory();}});
}
function invAction(id,name,type){
  document.getElementById('invActionId').value=id;document.getElementById('invActionType').value=type;
  document.getElementById('invActionTitle').innerHTML=(type==='restock'?'+ إضافة وارد':'&#128221; جرد فعلي')+' — '+name+' <span class="mc" onclick="closeM(\'invActionModal\')">&#10005;</span>';
  document.getElementById('invActionDesc').textContent=type==='restock'?'الكمية الواردة الجديدة':'الكمية الفعلية في المخزن حالياً';
  document.getElementById('invQty').value='';document.getElementById('invNote').value='';
  openM('invActionModal');
}
function submitInvAction(){
  var id=document.getElementById('invActionId').value,type=document.getElementById('invActionType').value;
  var qty=parseFloat(document.getElementById('invQty').value);
  if(isNaN(qty)||qty<0){toast('أدخل كمية','err');return;}
  api('/api/inventory/'+id+'/'+type,{method:'POST',body:JSON.stringify({quantity:qty,notes:document.getElementById('invNote').value})})
  .then(d=>{toast(d.message,d.success?'ok':'err');if(d.success){closeM('invActionModal');loadInventory();}});
}

// Menu
function buildCatOpts(){
  var opts=G_cats.map(c=>`<option value="${c.id}">${c.icon} ${c.name_ar}</option>`).join('');
  document.getElementById('itemCat').innerHTML='<option value="">اختر القسم</option>'+opts;
  document.getElementById('filterCat').innerHTML='<option value="">الكل</option>'+opts;
}
function loadMenuMgr(){
  var cat=document.getElementById('filterCat').value;
  fetch('/api/items'+(cat?'?category_id='+cat:'')).then(r=>r.json()).then(items=>{
    var icon=id=>{var c=G_cats.find(x=>x.id===id);return c?c.icon:'☕';};
    document.getElementById('menuMgrContent').innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px">'
      +items.map(it=>{
        var img=it.image_path?`<img src="${it.image_path}" style="width:100%;height:80px;object-fit:cover;display:block">`
          :`<div style="width:100%;height:80px;background:var(--dark4);display:flex;align-items:center;justify-content:center;font-size:28px">${icon(it.category_id)}</div>`;
        return`<div style="background:var(--dark3);border:1px solid var(--border);border-radius:10px;overflow:hidden">${img}<div style="padding:10px"><div style="font-size:13px;font-weight:700;margin-bottom:3px">${it.name_ar}</div><div style="font-size:12px;color:var(--gold);margin-bottom:8px">${fmt(it.price)} د.أ</div><div style="display:flex;gap:5px"><button class="btn btn-outline" style="padding:3px 8px;font-size:11px" onclick="editItem(${it.id})">&#9998;</button><span class="badge ${it.is_available?'bg':'br'}" style="padding:4px 8px">${it.is_available?'متاح':'مغلق'}</span></div></div></div>`;
      }).join('')+'</div>';
  });
}
function editItem(id){
  var it=G_items.find(i=>i.id===id);if(!it)return;
  editItemId=id;
  document.getElementById('itemModalTitle').innerHTML='تعديل الصنف <span class="mc" onclick="closeM(\'addItemModal\')">&#10005;</span>';
  document.getElementById('itemId').value=id;
  document.getElementById('itemNameAr').value=it.name_ar;
  document.getElementById('itemName').value=it.name||'';
  document.getElementById('itemCat').value=it.category_id;
  document.getElementById('itemPrice').value=it.price;
  document.getElementById('itemDesc').value=it.description||'';
  document.getElementById('itemAvail').checked=!!it.is_available;
  openM('addItemModal');
}
function saveItem(){
  var id=document.getElementById('itemId').value;
  var data={category_id:parseInt(document.getElementById('itemCat').value),name:document.getElementById('itemName').value||document.getElementById('itemNameAr').value,name_ar:document.getElementById('itemNameAr').value,price:parseFloat(document.getElementById('itemPrice').value),description:document.getElementById('itemDesc').value,is_available:document.getElementById('itemAvail').checked?1:0};
  if(!data.name_ar||!data.category_id||!data.price){toast('أكمل الحقول المطلوبة','err');return;}
  var url=id?'/api/items/'+id:'/api/items',method=id?'PUT':'POST';
  api(url,{method,body:JSON.stringify(data)}).then(d=>{
    if(d.success){
      var itemId=id||d.id;
      var imgFile=document.getElementById('itemImg').files[0];
      if(imgFile){var fd=new FormData();fd.append('image',imgFile);fetch('/api/items/'+itemId+'/image',{method:'POST',body:fd}).then(()=>{toast('تم الحفظ مع الصورة');finishItemSave();});}
      else{toast(d.message);finishItemSave();}
    }else toast(d.message,'err');
  });
}
function finishItemSave(){
  closeM('addItemModal');editItemId=null;document.getElementById('itemId').value='';document.getElementById('itemImg').value='';
  fetch('/api/items').then(r=>r.json()).then(it=>{G_items=it;loadMenuMgr();});
}

// Reports
function loadMonthly(){
  var month=document.getElementById('reportMonth').value;if(!month)return;
  Promise.all([fetch('/api/reports/top-items?limit=6').then(r=>r.json()),fetch('/api/reports/monthly?month='+month).then(r=>r.json())])
  .then(([top,mo])=>{
    var html=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div style="background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px"><div style="font-weight:700;color:var(--gold);margin-bottom:8px;font-size:13px">&#128200; الأكثر مبيعاً</div><div class="tbl-wrap"><table><tr><th>الصنف</th><th>الكمية</th><th>الإيراد</th></tr>${top.top.map(r=>`<tr><td>${r.item_name}</td><td style="font-weight:700;color:var(--gold)">${r.total_qty}</td><td style="color:var(--green)">${fmt(r.total_revenue)}</td></tr>`).join('')}</table></div></div>
      <div style="background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px"><div style="font-weight:700;color:var(--gold);margin-bottom:8px;font-size:13px">&#128201; الأقل مبيعاً</div><div class="tbl-wrap"><table><tr><th>الصنف</th><th>الكمية</th></tr>${top.bottom.map(r=>`<tr><td>${r.item_name}</td><td style="color:var(--red)">${r.total_qty}</td></tr>`).join('')}</table></div></div>
    </div>
    <div style="background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px">
      <div style="font-weight:700;color:var(--gold);margin-bottom:10px;font-size:13px">&#128197; شهر ${month}</div>
      <div class="stats" style="margin-bottom:10px"><div class="stat"><div class="stat-label">الإجمالي</div><div class="stat-val">${fmt(mo.totals.total)} <small>د.أ</small></div></div><div class="stat"><div class="stat-label">كاش</div><div class="stat-val">${fmt(mo.totals.cash)}</div></div><div class="stat"><div class="stat-label">كليك</div><div class="stat-val">${fmt(mo.totals.cliq)}</div></div><div class="stat"><div class="stat-label">أيام العمل</div><div class="stat-val">${mo.totals.days}</div></div></div>
      <div class="tbl-wrap"><table><tr><th>التاريخ</th><th>كاش</th><th>كليك</th><th>الإجمالي</th></tr>${mo.records.map(r=>`<tr><td>${r.date}</td><td>${fmt(r.total_sales_cash)}</td><td>${fmt(r.total_sales_cliq)}</td><td style="font-weight:700;color:var(--gold)">${fmt(r.total_sales)}</td></tr>`).join('')}</table></div>
    </div>`;
    document.getElementById('reportsContent').innerHTML=html;
  });
}

function logout(){fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/login');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay:not(.h)').forEach(o=>o.classList.add('h'));});
init();
</script>
</body>
</html>
