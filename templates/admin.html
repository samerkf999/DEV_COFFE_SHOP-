<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>نشمي — لوحة المالك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-dim:#8a6b28;--dark:#0d0a07;--dark2:#141008;--dark3:#1c1510;--dark4:#241a10;--border:rgba(201,168,76,.18);--white:#fff8ed;--sub:#a08060;--green:#4caf7d;--red:#e05555;--blue:#5599cc}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--dark);color:var(--white);font-family:'Tajawal',sans-serif;display:flex;flex-direction:column;font-size:13px}
.topbar{height:48px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0}
.topbar img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.topbar-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--gold);flex:1}
.topbar-right{display:flex;gap:6px;align-items:center;font-size:10px}
.role-chip{padding:2px 8px;border-radius:8px;background:rgba(201,168,76,.15);color:var(--gold);border:1px solid var(--border)}
.btn-sm{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:10px;cursor:pointer;font-family:'Tajawal',sans-serif}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:140px;background:var(--dark2);border-right:1px solid var(--border);padding:6px 0;flex-shrink:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2)}
.nav-item{padding:7px 10px;cursor:pointer;color:var(--sub);font-size:11px;font-weight:500;white-space:nowrap;border-left:3px solid transparent;-webkit-user-select:none}
.nav-item.active{background:rgba(201,168,76,.1);color:var(--gold);border-left-color:var(--gold)}
.main{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2)}
.page{display:none}.page.active{display:block}
.page-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--gold);margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
@media(min-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:8px;position:relative}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold);border-radius:8px 8px 0 0}
.stat-label{font-size:9px;color:var(--sub);margin-bottom:3px}
.stat-val{font-size:13px;font-weight:700}
.stat-val small{font-size:9px;color:var(--sub)}
.btn{padding:6px 12px;border-radius:7px;border:none;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;-webkit-user-select:none;-webkit-touch-callout:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#1a1000}
.btn-red{background:rgba(224,85,85,.15);border:1px solid rgba(224,85,85,.3);color:var(--red)}
.btn-green{background:rgba(76,175,125,.15);border:1px solid rgba(76,175,125,.3);color:var(--green)}
.btn:active{filter:brightness(0.9)}
.section{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:2px}
label{font-size:10px;color:var(--sub);font-weight:600}
input,select,textarea{background:var(--dark4);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--white);font-family:'Tajawal',sans-serif;font-size:11px;outline:none;width:100%;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:60px}
.tbl-wrap{background:var(--dark4);border:1px solid var(--border);border-radius:6px;overflow-x:auto;overflow-y:auto;max-height:280px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:10px}
th{background:var(--dark3);color:var(--gold);font-weight:700;padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);position:sticky;top:0}
td{padding:6px 8px;border-bottom:1px solid rgba(201,168,76,.05);white-space:nowrap}
tr:hover td{background:rgba(201,168,76,.04)}
.badge{font-size:8px;padding:1px 5px;border-radius:6px;font-weight:700;display:inline-block}
.bg{background:rgba(76,175,125,.15);color:var(--green)}.br{background:rgba(224,85,85,.15);color:var(--red)}.bo{background:rgba(201,168,76,.15);color:var(--gold)}
.toolbar{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px;-webkit-user-select:none}
.modal-overlay.show{display:flex}
.modal{background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:12px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-title{font-family:'Playfair Display',serif;font-size:13px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.mc{cursor:pointer;color:var(--sub);font-size:14px;-webkit-user-select:none;line-height:1}
.divider{border:none;border-top:1px solid var(--border);margin:8px 0}
#toast{position:fixed;bottom:10px;left:10px;z-index:999;display:flex;flex-direction:column;gap:4px;max-width:240px}
.toast{padding:7px 10px;border-radius:6px;font-size:10px;font-weight:700;animation:slideIn .3s ease}
.tok{background:rgba(76,175,125,.2);border:1px solid rgba(76,175,125,.4);color:#7de0aa}
.terr{background:rgba(224,85,85,.2);border:1px solid rgba(224,85,85,.4);color:#f09090}
@keyframes slideIn{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:480px){
  .topbar{height:44px;padding:0 8px}
  .topbar-title{font-size:12px}
  .sidebar{width:120px;padding:4px 0}
  .nav-item{padding:5px 8px;font-size:10px}
  .main{padding:6px}
  .page-title{font-size:12px}
  .stats{grid-template-columns:1fr}
  .stat{padding:6px}
  .stat-val{font-size:11px}
  td,th{padding:5px 6px;font-size:9px}
  .btn{padding:5px 8px;font-size:10px;gap:3px}
}
</style>
</head>
<body>
<div class="topbar">
  <img src="/static/logo.jpg" alt="" onerror="this.style.display='none'">
  <div class="topbar-title">نشمي كافيه — المالك</div>
  <div class="topbar-right">
    <span id="user" style="color:var(--sub)"></span>
    <span class="role-chip">Owner</span>
    <button class="btn-sm" onclick="logout()">خروج</button>
  </div>
</div>
<div class="layout">
  <nav class="sidebar">
    <div class="nav-item active" onclick="go('dash')">📊</div>
    <div class="nav-item" onclick="go('daily')">📅</div>
    <div class="nav-item" onclick="go('orders')">📝</div>
    <div class="nav-item" onclick="go('acc')">💼</div>
    <div class="nav-item" onclick="go('inv')">📦</div>
    <div class="nav-item" onclick="go('menu')">✏️</div>
    <div class="nav-item" onclick="go('reports')">📈</div>
    <div class="nav-item" onclick="go('set')">⚙️</div>
  </nav>
  <main class="main">
    <div class="page active" id="page-dash">
      <div class="page-title">📊 الرئيسية</div>
      <div class="stats" id="stats"></div>
      <div class="toolbar"><a href="/pos" class="btn btn-gold">➤ POS</a><a href="/customer-order" class="btn btn-green">🛒 طلب</a><a href="/manager" class="btn btn-blue" style="border:1px solid rgba(85,153,204,.3);background:rgba(85,153,204,.1);color:#5599cc">👨 مدير</a></div>
    </div>
    <div class="page" id="page-daily"><div class="page-title">📅 اليوم</div><div id="daily"></div></div>
    <div class="page" id="page-orders"><div class="page-title">📝 الطلبات</div><div class="toolbar"><input type="date" id="od" onchange="loadOrd()" style="width:auto;font-size:11px"></div><div id="ords"></div></div>
    <div class="page" id="page-acc"><div class="page-title">💼 الذمم</div><div class="toolbar"><button class="btn btn-gold" onclick="showM('am')">+ حساب</button></div><div id="accs"></div></div>
    <div class="page" id="page-inv"><div class="page-title">📦 المخزون</div><div class="toolbar"><button class="btn btn-gold" onclick="showM('im')">+ مادة</button></div><div id="invs"></div></div>
    <div class="page" id="page-menu"><div class="page-title">✏️ المنيو</div><div class="toolbar"><select id="fc" onchange="loadMenu()" style="width:auto;font-size:11px"><option value="">الكل</option></select><button class="btn btn-gold" onclick="showM('itm')">+ صنف</button></div><div id="menu"></div></div>
    <div class="page" id="page-reports"><div class="page-title">📈 التقارير</div><div class="toolbar"><input type="month" id="rm" onchange="loadRep()" style="width:auto;font-size:11px"></div><div id="rep"></div></div>
    <div class="page" id="page-set"><div class="page-title">⚙️ الإعدادات</div><div id="set"></div></div>
  </main>
</div>

<div class="modal-overlay" id="am"><div class="modal"><div class="modal-title">حساب <span class="mc" onclick="hideM('am')">✕</span></div><div class="fg" style="margin-bottom:8px"><label>الاسم *</label><input id="an"></div><div class="fg" style="margin-bottom:10px"><label>الهاتف</label><input id="ap" type="tel"></div><button class="btn btn-gold" style="width:100%">حفظ</button></div></div>
<div class="modal-overlay" id="im"><div class="modal"><div class="modal-title">مادة <span class="mc" onclick="hideM('im')">✕</span></div><div class="fg" style="margin-bottom:8px"><label>الاسم *</label><input id="in"></div><div class="form-row"><div class="fg"><label>الوحدة *</label><input id="iu"></div><div class="fg"><label>الكمية</label><input id="is" type="number" step="0.01" value="0"></div></div><div class="fg" style="margin-bottom:10px"><label>حد</label><input id="im2" type="number" step="0.01" value="0"></div><button class="btn btn-gold" style="width:100%">حفظ</button></div></div>
<div class="modal-overlay" id="itm"><div class="modal"><div class="modal-title" id="imt">صنف <span class="mc" onclick="hideM('itm')">✕</span></div><input type="hidden" id="iid"><div class="form-row"><div class="fg"><label>عربي *</label><input id="iar"></div><div class="fg"><label>إنجليزي</label><input id="ia"></div></div><div class="form-row"><div class="fg"><label>قسم *</label><select id="ic"></select></div><div class="fg"><label>السعر *</label><input id="ip" type="number" step="0.001" min="0"></div></div><div class="fg" style="margin-bottom:8px"><label>وصف</label><textarea id="id" style="min-height:50px"></textarea></div><div class="fg" style="margin-bottom:10px"><label>صورة</label><input type="file" id="ii" accept="image/*"></div><label style="display:flex;gap:5px;margin-bottom:10px"><input type="checkbox" id="ia2" checked style="width:auto"> متاح</label><button class="btn btn-gold" style="width:100%">✓</button></div></div>

<div id="toast"></div>
<script>
var C=[],I={},api=(u,o)=>fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o||{})).then(r=>r.json()),fmt=n=>parseFloat(n||0).toFixed(3);
function init(){fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(!d.loggedIn)location.href='/login';document.getElementById('user').textContent=d.user.name;});Promise.all([fetch('/api/categories').then(r=>r.json()),fetch('/api/items').then(r=>r.json()),fetch('/api/daily/today').then(r=>r.json())]).then(([c,it,day])=>{C=c;it.forEach(x=>{if(!I[x.category_id])I[x.category_id]=[];I[x.category_id].push(x);});buildCats();loadDash(day);document.getElementById('od').value=today();document.getElementById('rm').value=today().substring(0,7);});}
function today(){return new Date().toISOString().split('T')[0];}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');event.target.classList.add('active');if(p==='daily')loadDaily();if(p==='orders')loadOrd();if(p==='acc')loadAcc();if(p==='inv')loadInv();if(p==='menu')loadMenu();if(p==='reports')loadRep();if(p==='set')loadSet();}
function showM(id){document.getElementById(id).classList.add('show');}function hideM(id){document.getElementById(id).classList.remove('show');}
function toast(m){var e=document.createElement('div');e.className='toast tok';e.textContent=m;document.getElementById('toast').appendChild(e);setTimeout(()=>e.remove(),2500);}
function buildCats(){var o='<option value="">الكل</option>'+C.map(c=>`<option value="${c.id}">${c.icon} ${c.name_ar}</option>`).join('');document.getElementById('fc').innerHTML=o;document.getElementById('ic').innerHTML='<option value="">اختر</option>'+C.map(c=>`<option value="${c.id}">${c.icon} ${c.name_ar}</option>`).join('');}
function loadDash(rec){fetch('/api/reports/dashboard').then(r=>r.json()).then(d=>{document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-label">مبيعات اليوم</div><div class="stat-val">${fmt(d.today_sales)} <small>د.أ</small></div></div><div class="stat"><div class="stat-label">كاش</div><div class="stat-val">${fmt(d.today_cash)}</div></div><div class="stat"><div class="stat-label">كليك</div><div class="stat-val">${fmt(d.today_cliq)}</div></div><div class="stat"><div class="stat-label">الطلبات</div><div class="stat-val">${d.today_orders}</div></div><div class="stat"><div class="stat-label">الذمم</div><div class="stat-val">${fmt(d.total_debt)}</div></div><div class="stat"><div class="stat-label">تنبيهات</div><div class="stat-val" style="color:${d.low_stock>0?'var(--red)':'var(--green)'}">${d.low_stock}</div></div>`;});}
function loadDaily(){fetch('/api/daily/today').then(r=>r.json()).then(rec=>{var h=rec&&rec.status==='open'?`<div class="stats"><div class="stat"><div class="stat-label">مبيعات</div><div class="stat-val">${fmt(rec.total_sales)}</div></div><div class="stat"><div class="stat-label">كاش</div><div class="stat-val">${fmt(rec.total_sales_cash)}</div></div><div class="stat"><div class="stat-label">كليك</div><div class="stat-val">${fmt(rec.total_sales_cliq)}</div></div></div><button class="btn btn-red" onclick="api('/api/daily/close',{method:'POST',body:JSON.stringify({closing_cash:0})}).then(d=>{toast(d.message);loadDaily();})">إغلاق</button>`:`<button class="btn btn-gold" onclick="api('/api/daily/open',{method:'POST',body:JSON.stringify({opening_cash:0})}).then(d=>{toast(d.message);loadDaily();})">فتح</button>`;document.getElementById('daily').innerHTML=h;});}
function loadOrd(){var dt=document.getElementById('od').value;api('/api/orders?date='+dt).then(ords=>{var h=ords.length?'<div class="tbl-wrap"><table><tr><th>#</th><th>وقت</th><th>دفع</th><th>المجموع</th></tr>'+ords.map(o=>`<tr><td>${o.id}</td><td style="font-size:9px">${(o.created_at||'').substring(11,16)}</td><td><span class="badge bo">${o.payment_method==='cash'?'كاش':'كليك'}</span></td><td style="color:var(--gold);font-weight:700">${fmt(o.total_amount)}</td></tr>`).join('')+'</table></div>':'<p style="color:var(--sub);font-size:11px">بلا</p>';document.getElementById('ords').innerHTML=h;});}
function loadAcc(){fetch('/api/accounts').then(r=>r.json()).then(rows=>{var h=rows.length?'<div class="tbl-wrap"><table><tr><th>الزبون</th><th>الدين</th></tr>'+rows.map(a=>`<tr><td>${a.customer_name}</td><td style="color:var(--red);font-weight:700">${fmt(a.total_debt)}</td></tr>`).join('')+'</table></div>':'<p style="font-size:11px">بلا</p>';document.getElementById('accs').innerHTML=h;});}
function loadInv(){fetch('/api/inventory').then(r=>r.json()).then(rows=>{var h='<div class="tbl-wrap"><table><tr><th>المادة</th><th>كمية</th><th>حد</th></tr>'+rows.map(r=>{var L=r.current_stock<=r.min_stock;return`<tr><td${L?' style="color:var(--red);font-weight:700"':''} >${r.name}</td><td>${r.current_stock}</td><td>${r.min_stock}</td></tr>`;}).join('')+'</table></div>';document.getElementById('invs').innerHTML=h;});}
function loadMenu(){var c=document.getElementById('fc').value;fetch('/api/items'+(c?'?category_id='+c:'')).then(r=>r.json()).then(items=>{var h='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">'+items.map(it=>`<div style="background:var(--dark4);border:1px solid var(--border);border-radius:6px;padding:6px"><div style="font-size:11px;font-weight:700;line-height:1.2;margin-bottom:2px">${it.name_ar}</div><div style="font-size:10px;color:var(--gold);margin-bottom:4px">${fmt(it.price)}</div><button class="btn btn-outline" style="padding:2px 5px;font-size:9px" onclick="editIt(${it.id})">✏️</button></div>`).join('')+'</div>';document.getElementById('menu').innerHTML=h;});}
function editIt(id){var it=Object.values(I).flat().find(x=>x.id===id);if(!it)return;document.getElementById('imt').textContent='تعديل — '+it.name_ar;document.getElementById('iid').value=id;document.getElementById('iar').value=it.name_ar;document.getElementById('ia').value=it.name||'';document.getElementById('ic').value=it.category_id;document.getElementById('ip').value=it.price;document.getElementById('id').value=it.description||'';document.getElementById('ia2').checked=!!it.is_available;showM('itm');}
function loadRep(){var m=document.getElementById('rm').value;if(!m)return;Promise.all([fetch('/api/reports/top-items?limit=6').then(r=>r.json()),fetch('/api/reports/monthly?month='+m).then(r=>r.json())]).then(([top,mo])=>{var h='<div class="section"><div style="font-weight:700;color:var(--gold);margin-bottom:6px;font-size:11px">⭐ الأكثر</div><div class="tbl-wrap"><table><tr><th>الصنف</th><th>الكمية</th></tr>'+top.top.slice(0,5).map(r=>`<tr><td style="font-size:9px">${r.item_name}</td><td style="color:var(--gold);font-weight:700">${r.total_qty}</td></tr>`).join('')+'</table></div></div><div class="section"><div style="font-weight:700;color:var(--gold);margin-bottom:6px;font-size:11px">Σ الإجمالي: '+fmt(mo.totals.total)+' د.أ</div></div>';document.getElementById('rep').innerHTML=h;});}
function loadSet(){document.getElementById('set').innerHTML='<div class="section"><div class="fg" style="margin-bottom:8px"><label>الكافيه *</label><input id="sn"></div><div class="fg" style="margin-bottom:8px"><label>الهاتف</label><input id="sp" type="tel"></div><div class="fg" style="margin-bottom:8px"><label>عدد الطاولات</label><input id="st" type="number" min="1" value="10"></div><div class="fg" style="margin-bottom:8px"><label>Wi-Fi</label><input id="sw"></div><button class="btn btn-gold" style="width:100%" onclick="saveSets()">✓ حفظ</button></div>';fetch('/api/settings').then(r=>r.json()).then(s=>{document.getElementById('sn').value=s.cafe_name||'';document.getElementById('sp').value=s.phone||'';document.getElementById('st').value=s.tables_count||10;document.getElementById('sw').value=s.wifi_name||'';});}
function saveSets(){api('/api/settings',{method:'POST',body:JSON.stringify({cafe_name:document.getElementById('sn').value,phone:document.getElementById('sp').value,tables_count:document.getElementById('st').value,wifi_name:document.getElementById('sw').value})}).then(d=>{toast(d.message);});}
function logout(){fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/login');}
init();
</script>
</body>
</html>
